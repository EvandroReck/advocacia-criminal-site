<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Painel Admin — AR Advocacia Criminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="login-wrap">
        <div class="login-card">
            <div class="login-header">
                <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1.5rem;">
                    <span class="logo-mark">AR</span>
                    <span class="logo-text">Advocacia<br>Criminal</span>
                </a>
                <p class="eyebrow" style="text-align: center;">Área restrita</p>
                <h1>Painel de Admin</h1>
                <p class="login-subtitle">Informe e-mail e senha para continuar.</p>
            </div>

            <form id="form-login" class="form-card" style="border: none; background: transparent; padding: 0;">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required placeholder="••••••••" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-gold btn-block" id="btn-login">
                    <span class="btn-text">Entrar</span>
                    <span class="btn-loader hidden"></span>
                </button>
                <div id="login-erro" class="alert alert-error hidden" style="margin-top: 1rem;"></div>
            </form>

            <p class="login-back">
                <a href="index.html">← Voltar ao site</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Se já estiver logado, vai direto pro admin
            if (Auth.isLoggedIn()) {
                window.location.href = 'admin.html';
                return;
            }

            const form = document.getElementById('form-login');
            const erro = document.getElementById('login-erro');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                erro.classList.add('hidden');

                const btn = document.getElementById('btn-login');
                const btnText = btn.querySelector('.btn-text');
                const btnLoader = btn.querySelector('.btn-loader');

                btnText.classList.add('hidden');
                btnLoader.classList.remove('hidden');
                btn.disabled = true;

                await new Promise(r => setTimeout(r, 600));

                const email = document.getElementById('email').value.trim();
                const senha = document.getElementById('senha').value;

                const result = Auth.login(email, senha);

                if (result.ok) {
                    window.location.href = 'admin.html';
                } else {
                    erro.textContent = result.message || 'E-mail ou senha incorretos.';
                    erro.classList.remove('hidden');
                    btnText.classList.remove('hidden');
                    btnLoader.classList.add('hidden');
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
